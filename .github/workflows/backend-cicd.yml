name: Backend CI/CD

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'flashsale-backend/**'
      - '.github/workflows/backend-cicd.yml'
  push:
    branches:
      - develop
    paths:
      - 'flashsale-backend/**'
      - '.github/workflows/backend-cicd.yml'

permissions:
  contents: read

concurrency:
  group: backend-deploy-develop
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate (lint, format, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      HUSKY: 0
    defaults:
      run:
        working-directory: flashsale-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: flashsale-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Lint check
        run: pnpm lint:check

      - name: Format check
        run: pnpm format:check

      - name: Build check
        run: pnpm build

      - name: Docker build check
        run: docker build -t flashsale-backend:ci-${{ github.sha }} -f docker/Dockerfile .

  deploy-development:
    name: Deploy Development
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: development

    env:
      SERVER_USER: root
      SERVER_IP: 159.65.134.11
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}

    steps:
      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -euo pipefail

            APP_DIR="project/flash-sale/flashsale-backend"
            IMAGE_TAG="${{ github.sha }}"
            IMAGE_NAME="flashsale-backend"
            CONTAINER_NAME="flashsale_backend"

            echo "📦 Navigating to project directory..."
            cd "$APP_DIR"

            echo "🔄 Updating source code..."
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop

            echo "🏗️ Building Docker image..."
            docker build -t "${IMAGE_NAME}:${IMAGE_TAG}" -f docker/Dockerfile .

            echo "🧹 Removing old container (if exists)..."
            docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name "$CONTAINER_NAME" \
              --env-file .env \
              -e NODE_ENV=production \
              --network host \
              --restart unless-stopped \
              "${IMAGE_NAME}:${IMAGE_TAG}"

            echo "🔍 Running health check..."
            HEALTH_URLS=(
              "http://localhost:5686/api/v1/health"
              "http://localhost:5686/health"
              "http://localhost:5686/api/health"
            )
            HEALTHCHECK_PASSED=0

            for i in $(seq 1 30); do
              for url in "${HEALTH_URLS[@]}"; do
                if curl -fsS "$url" >/dev/null; then
                  echo "✅ Health check passed: $url"
                  HEALTHCHECK_PASSED=1
                  break 2
                fi
              done

              sleep 2
            done

            if [ "$HEALTHCHECK_PASSED" -ne 1 ]; then
              echo "❌ Health check failed"
              echo "Checked URLs: ${HEALTH_URLS[*]}"
              docker ps -a --filter "name=$CONTAINER_NAME"
              docker logs --tail 200 "$CONTAINER_NAME"
              exit 1
            fi

            echo "🧽 Cleaning dangling images..."
            docker image prune -f

            echo "✅ Deployment completed"