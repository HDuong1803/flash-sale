name: Deploy Pipeline
 
on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    env:
      ENVIRONMENT: development
      DOCKER_IMAGE_NAME: duongdh1/decot-api
      DOCKER_IMAGE_TAG: ${{ github.sha }}
      DOCKER_HUB_REGISTRY_USER: ${{ secrets.DOCKER_HUB_REGISTRY_USER }}
      DOCKER_HUB_REGISTRY_PASSWORD: ${{ secrets.DOCKER_HUB_REGISTRY_PASSWORD }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SERVER_USER: root
      SERVER_IP: 159.65.134.11
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_REGISTRY_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_HUB_REGISTRY_USER }}" --password-stdin

      - name: Build Docker image
        run: |
          chmod u+x ./deploy/develop/build.sh
          ./deploy/develop/build.sh

      - name: Push Docker image
        run: |
          docker push duongdh1/decot-api:${{ github.sha }}

      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            echo "Pulling new image from Docker Hub..."
            docker pull duongdh1/decot-api:${{ github.sha }}

            echo "Running new container..."
            docker service update --image duongdh1/decot-api:${{ github.sha }} decot-api-dev

  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    env:
      ENVIRONMENT: staging
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SERVER_USER: root
      SERVER_IP: 159.65.134.11
    steps:
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -e

            echo "📦 Navigating to project directory..."
            cd decot-api
            
            echo "🔄 Pulling latest code from Git..."
            git pull origin staging
            
            echo "🏗️ Building Docker image..."
            IMAGE_TAG=${{ github.sha }}
            docker build -t decot-api-staging:${IMAGE_TAG} -f docker/Dockerfile .
            
            echo "🚀 Updating Docker service..."
            docker service update --image decot-api-staging:${IMAGE_TAG} decot-api-staging
            
            echo "✅ Deployment completed!"


  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      ENVIRONMENT: production
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SERVER_USER: root
      SERVER_IP: 159.65.134.11
    steps:
      - name: Deploy on Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          password: ${{ env.SSH_PASSWORD }}
          script: |
            set -e

            echo "📦 Navigating to project directory..."
            cd decot-api-main
            
            echo "🔄 Pulling latest code from Git..."
            git pull origin main
            
            echo "🏗️ Building Docker image..."
            IMAGE_TAG=${{ github.sha }}
            docker build -t decot-api-main:${IMAGE_TAG} -f docker/Dockerfile .
            
            echo "🚀 Updating Docker service..."
            docker service update --image decot-api-main:${IMAGE_TAG} decot-api-main
            
            echo "✅ Deployment completed!"