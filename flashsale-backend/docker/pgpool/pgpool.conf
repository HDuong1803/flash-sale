# pgpool.conf - PgPool-II Configuration
# Connection pooling and load balancing configuration

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------

# - pgpool Communication Manager Connection Settings -
listen_addresses = '*'
port = 5433
socket_dir = '/tmp'

# - Backend Connection Settings -
backend_hostname0 = 'postgres'
backend_port0 = 5432
backend_weight0 = 1
backend_data_directory0 = '/var/lib/postgresql/data'
backend_flag0 = 'ALLOW_TO_FAILOVER'

# Multiple backends for load balancing (uncomment if needed)
# backend_hostname1 = 'postgres-replica'
# backend_port1 = 5432
# backend_weight1 = 1
# backend_data_directory1 = '/var/lib/postgresql/data'
# backend_flag1 = 'ALLOW_TO_FAILOVER'

#------------------------------------------------------------------------------
# POOLS
#------------------------------------------------------------------------------

# - Pool size -
num_init_children = 10                    # Number of pools
max_pool = 4                              # Number of connections per pool
child_life_time = 300                     # Pool life time (5 minutes)
child_max_connections = 0                 # Unlimited connections per child

# - Connection pool mode -
connection_cache = on                     # Connection cache
reset_query_list = 'ABORT; DISCARD ALL'  # Reset queries

#------------------------------------------------------------------------------
# LOAD BALANCING MODE
#------------------------------------------------------------------------------

load_balance_mode = on                    # Enable load balancing
ignore_leading_white_space = on
read_only_function_list = ''
write_function_list = ''
primary_routing_query_pattern_list = ''
database_redirect_preference_list = ''

# - Statement load balancing -
allow_sql_comments = on
disable_load_balance_on_write = 'transaction'

#------------------------------------------------------------------------------
# MASTER/SLAVE MODE (if using replication)
#------------------------------------------------------------------------------

master_slave_mode = off                   # Disable for single master
master_slave_sub_mode = 'sync'           # Synchronous replication

# - Streaming replication check -
sr_check_period = 10
sr_check_user = 'postgres'
sr_check_password = ''
sr_check_database = 'postgres'
delay_threshold = 10000000

#------------------------------------------------------------------------------
# HEALTH CHECK
#------------------------------------------------------------------------------

health_check_period = 10                 # Health check interval (seconds)
health_check_timeout = 5                 # Health check timeout (seconds)
health_check_user = 'postgres'
health_check_password = ''
health_check_database = 'postgres'
health_check_max_retries = 3
health_check_retry_delay = 1

#------------------------------------------------------------------------------
# FAILOVER AND FAILBACK
#------------------------------------------------------------------------------

failover_command = ''                     # Failover command
failback_command = ''                     # Failback command
failover_on_backend_error = on
detach_false_primary = off

#------------------------------------------------------------------------------
# ONLINE RECOVERY
#------------------------------------------------------------------------------

recovery_user = 'postgres'
recovery_password = ''
recovery_1st_stage_command = ''
recovery_2nd_stage_command = ''
recovery_timeout = 90

#------------------------------------------------------------------------------
# WATCHDOG (for high availability)
#------------------------------------------------------------------------------

use_watchdog = off                        # Disable watchdog for simple setup

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

log_destination = 'stderr'
logging_collector = on
log_directory = '/var/log/pgpool'
log_filename = 'pgpool-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d                     # Rotate every day
log_rotation_size = 10MB
log_min_messages = warning
log_error_verbosity = default

# - Connection logging -
log_connections = on
log_hostname = on
log_statement = off

# - Performance logging -
log_per_node_statement = off
enable_shared_preload_libraries = off

#------------------------------------------------------------------------------
# CONNECTION POOL OPTIMIZATION
#------------------------------------------------------------------------------

# - Connection pooling optimization -
connection_life_time = 600               # Connection lifetime (10 minutes)
client_idle_limit = 0                    # No idle limit for clients
authentication_timeout = 60

# - Memory settings -
serialize_accept = off
enable_pool_hba = off
pool_passwd = 'pool_passwd'

#------------------------------------------------------------------------------
# STATEMENT TIMEOUT
#------------------------------------------------------------------------------

statement_timeout = 0                    # No statement timeout (handled by app)
lock_timeout = 0                         # No lock timeout
idle_in_transaction_session_timeout = 0  # No idle transaction timeout

#------------------------------------------------------------------------------
# SSL SETTINGS
#------------------------------------------------------------------------------

ssl = off                                 # Enable SSL if needed
ssl_cert = 'server.crt'
ssl_key = 'server.key'
ssl_ca_cert = ''
ssl_ca_cert_dir = ''

#------------------------------------------------------------------------------
# ERROR REPORTING
#------------------------------------------------------------------------------

client_min_messages = notice
log_min_error_statement = error
