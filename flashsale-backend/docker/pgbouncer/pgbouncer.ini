# pgbouncer.ini - PgBouncer configuration file
# Connection pooling for PostgreSQL

[databases]
# Database connections (update with your actual database info)
decot = host=postgres port=5432 dbname=decot
decot_test = host=postgres port=5432 dbname=decot_test

# Connection through direct database (bypass pooling for migrations)
decot_direct = host=postgres port=5432 dbname=decot pool_size=1 reserve_pool=0

[pgbouncer]

#------------------------------------------------------------------------------
# BASIC SETTINGS
#------------------------------------------------------------------------------

# Listen configuration
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
auth_hba_file = /etc/pgbouncer/pg_hba.conf

#------------------------------------------------------------------------------
# POOL CONFIGURATION
#------------------------------------------------------------------------------

# Pool mode (transaction is most efficient for web apps)
pool_mode = transaction

# Connection limits
max_client_conn = 200                     # Maximum client connections
default_pool_size = 20                    # Default pool size per database
min_pool_size = 5                         # Minimum connections to keep open
reserve_pool_size = 5                     # Emergency connection reserve
reserve_pool_timeout = 5                 # How long to wait for reserve pool

# Database connection limits
max_db_connections = 100                  # Max connections to database
max_user_connections = 100               # Max connections per user

#------------------------------------------------------------------------------
# TIMEOUTS
#------------------------------------------------------------------------------

server_reset_query = DISCARD ALL         # Query to reset server connection
server_reset_query_always = 0

# Connection timeouts
server_connect_timeout = 15               # Timeout for connecting to server
server_login_retry = 15                   # Retry count for login
client_login_timeout = 60                # Timeout for client login
autodb_idle_timeout = 3600               # Auto-database idle timeout (1 hour)

# Query timeouts
query_timeout = 0                        # No query timeout (handled by app)
query_wait_timeout = 120                 # How long to wait for connection
client_idle_timeout = 0                 # No client idle timeout
idle_transaction_timeout = 0             # No idle transaction timeout

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------

# Log destination
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Log levels (debug, info, warning, error)
log_level = info

# Connection logging
log_connections = 1                      # Log connections
log_disconnections = 1                   # Log disconnections
log_pooler_errors = 1                    # Log pooler errors

# Statement logging
log_stats = 1                           # Log statistics
stats_period = 60                       # Statistics period (60 seconds)

#------------------------------------------------------------------------------
# SECURITY
#------------------------------------------------------------------------------

# Admin settings
admin_users = postgres                   # Admin users
stats_users = postgres                   # Stats users (read-only admin)

# Ignore startup parameters
ignore_startup_parameters = extra_float_digits,geqo,search_path

# User restrictions
auth_query = SELECT username, password FROM public.user_auth WHERE username = $1

#------------------------------------------------------------------------------
# TLS/SSL SETTINGS
#------------------------------------------------------------------------------

# SSL configuration (uncomment if using SSL)
# server_tls_sslmode = prefer
# server_tls_ca_file = /etc/ssl/certs/ca.crt
# server_tls_cert_file = /etc/ssl/certs/server.crt
# server_tls_key_file = /etc/ssl/private/server.key
# server_tls_protocols = secure
# server_tls_ciphers = secure

# Client SSL
# client_tls_sslmode = disable
# client_tls_ca_file = 
# client_tls_cert_file = 
# client_tls_key_file = 
# client_tls_protocols = secure
# client_tls_ciphers = secure

#------------------------------------------------------------------------------
# PERFORMANCE TUNING
#------------------------------------------------------------------------------

# TCP settings
tcp_defer_accept = 0                     # TCP defer accept
tcp_socket_buffer = 0                    # TCP socket buffer
tcp_keepalive = 1                        # TCP keepalive
tcp_keepcnt = 0                          # TCP keepalive count
tcp_keepidle = 0                         # TCP keepalive idle
tcp_keepintvl = 0                        # TCP keepalive interval

# Buffer settings
listen_backlog = 128                     # Listen backlog
pkt_buf = 4096                          # Packet buffer size
max_packet_size = 2147483647            # Maximum packet size
sbuf_loopcnt = 5                        # Socket buffer loop count

# Memory management
dns_max_ttl = 15                        # DNS cache TTL
dns_nxdomain_ttl = 15                   # DNS negative cache TTL
dns_zone_check_period = 0               # DNS zone check period

#------------------------------------------------------------------------------
# MONITORING AND HEALTH CHECKS
#------------------------------------------------------------------------------

# Application name for monitoring
application_name_add_host = 1           # Add hostname to application name

# Health check settings
server_lifetime = 3600                  # Server connection lifetime (1 hour)
server_idle_timeout = 600               # Server idle timeout (10 minutes)

# Connection validation
server_check_delay = 30                 # Server check delay
server_check_query = SELECT 1           # Health check query

#------------------------------------------------------------------------------
# CONSOLE ACCESS
#------------------------------------------------------------------------------

# Unix socket for console access
unix_socket_dir = /tmp
unix_socket_mode = 0777
unix_socket_group = pgbouncer
