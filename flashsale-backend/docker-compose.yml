services:
  flashsale_backend:
    container_name: flashsale_backend
    build:
      context: .
      dockerfile: docker/Dockerfile
    # command: npm run start:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://twendee_user:twdWork2025@host.docker.internal:5432/twendee_work_dev_new?schema=public}
      DIRECT_DATABASE_URL: ${DIRECT_DATABASE_URL_DOCKER:-postgres://twendee_user:twdWork2025@host.docker.internal:5432/twendee_work_dev_new}
      RABBITMQ_URL: ${RABBITMQ_URL_DOCKER:-amqp://user:pass@host.docker.internal:5672}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - 5686:5686
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ${NETWORK}

  postgres:
    container_name: flashsale_postgres
    image: postgres
    profiles: ['local-db']
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      PGDATA: /data/postgres
      TZ: 'Etc/UTC'
    volumes:
      - postgres:/data/postgres
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    networks:
      - ${NETWORK}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flashsale}'
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    container_name: flashsale_pgbouncer
    image: edoburu/pgbouncer:latest
    profiles: ['pooling']
    ports:
      - '6432:6432'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flashsale}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-flashsale}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      MIN_POOL_SIZE: 5
      RESERVE_POOL_SIZE: 5
      MAX_DB_CONNECTIONS: 100
      AUTH_TYPE: md5
      ADMIN_USERS: ${POSTGRES_USER:-postgres}
      STATS_USERS: ${POSTGRES_USER:-postgres}
    volumes:
      - ./docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./docker/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ${NETWORK}
    restart: unless-stopped

  redis:
    container_name: flashsale_redis
    image: redis:latest
    ports:
      - '6379:6379'
    environment:
      TZ: 'Etc/UTC'
    volumes:
      - redis:/data
    networks:
      - ${NETWORK}

networks:
  flashsale_network:
    driver: bridge
    name: ${NETWORK}

volumes:
  postgres:
  redis:
